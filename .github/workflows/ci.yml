name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relay:
    name: Relay tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: relay/go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@v4.6.2
        with:
          name: relay-coverage
          path: relay/coverage.out
          if-no-files-found: error

  blossom:
    name: Blossom tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blossom
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: blossom/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Blossom rules tests
        run: node --test src/rules/index.test.mjs

      - name: Build Blossom and admin application
        run: pnpm build

  dashboard:
    name: Dashboard JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Check dashboard JavaScript syntax
        run: node --check relay/web/static/script.js

  nip-coverage:
    name: Validate NIP coverage matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate NIP coverage data
        shell: bash
        run: |
          set -euo pipefail
          matrix=tests/nips/coverage.tsv
          test -s "$matrix"
          awk -F '\t' '
            $1 ~ /^#/ { next }
            NF < 5 || $1 !~ /^NIP-[0-9A-Z]+$/ || ($3 != "integration" && $3 != "contract" && $3 != "manual" && $3 != "external") {
              print "invalid NIP coverage row " NR ": " $0 > "/dev/stderr"
              exit 1
            }
            END {
              if (NR < 1) {
                print "coverage.tsv contains no NIP entries" > "/dev/stderr"
                exit 1
              }
            }
          ' "$matrix"

          test -x tests/nips/run_all.sh
          test -x tests/nips/run_coverage.sh
