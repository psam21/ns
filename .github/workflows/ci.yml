name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Format gate.
  #
  # Separate from the relay job on purpose: a format failure should be
  # unambiguous in the CI UI rather than buried in a test job that also
  # builds, vets, and runs the suite.
  #
  # This exists because 25 files had drifted out of gofmt compliance with no
  # gate to catch it, and the drift was invisible for as long as nobody
  # happened to run `gofmt -l`. Whitespace-only drift is harmless in
  # isolation, but it means a genuine formatting mistake in a *new* change
  # cannot be distinguished from the existing background noise -- which is
  # exactly the condition under which reviewers stop looking.
  fmt:
    name: Go formatting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: true

      - name: Check gofmt compliance
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-compliant:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' from relay/ to fix."
            gofmt -d .
            exit 1
          fi
          echo "All Go files are gofmt-compliant."

  relay:
    name: Relay tests and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: relay/go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests with coverage
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Upload Go coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: relay-coverage
          path: relay/coverage.out
          if-no-files-found: error

  blossom:
    name: Blossom tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blossom
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Must be explicit. Without this the action cannot determine a
          # version and fails with "Error: No pnpm version is specified",
          # even though blossom/package.json declares
          # `packageManager: pnpm@9.12.0`. The action's inference relies on
          # packageManager being at the repository root, and this is a
          # monorepo where the manifest lives in blossom/.
          #
          # 9.12.0 is the version in that field and the one the lockfile
          # (lockfileVersion 9.0) and the deploy host both use.
          version: 9.12.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: blossom/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Compile before testing, not after.
      #
      # Every Blossom test imports compiled output from build/ -- e.g.
      # src/rules/index.test.mjs imports ../../build/rules/index.js -- and
      # build/ is gitignored, so a fresh checkout has no build/ at all. This
      # job ran the tests first and `pnpm build` second, so the tests always
      # failed with ERR_MODULE_NOT_FOUND. Every CI run on this workflow has
      # been red for that reason.
      #
      # It was masked locally because a stale build/ left over from a previous
      # local build satisfied the import. "Verified locally" was true and
      # meaningless: the local tree had an artifact CI could not have.
      #
      # `tsc` alone, not `pnpm build`: the tests need the compiled server
      # modules only. `pnpm build` also runs postbuild, which installs and
      # builds the entire admin workspace -- a large amount of work needed
      # only to produce dist/ that no test reads.
      #
      # If a test ever needs admin output, build it in the later step rather
      # than slowing every test run.
      - name: Compile TypeScript
        run: npx tsc

      # The unit suites, not just the rules suite.
      #
      # CI ran only src/rules/index.test.mjs while three other suites existed
      # and passed: helpers/security (5 tests) and api/upload (11). Those cover
      # SSRF address blocking, URL construction and upload validation -- the
      # security-relevant paths in this service. src/api/e2e.test.mjs is
      # deliberately excluded: it boots the app against a live database and
      # storage backend, so it belongs in an integration job with services
      # configured, not in the unit step.
      #
      # Naming the files explicitly rather than globbing: a glob would
      # silently pull in e2e.test.mjs the first time someone adds a test that
      # needs live services, and the failure would look like a broken build
      # rather than a mis-scoped test.
      - name: Run Blossom unit tests
        run: |
          node --test \
            src/rules/index.test.mjs \
            src/helpers/security.test.mjs \
            src/api/upload.test.mjs

      - name: Build Blossom and admin application
        run: pnpm build

  dashboard:
    name: Dashboard JavaScript syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check dashboard JavaScript syntax
        run: node --check relay/web/static/script.js

  nip-coverage:
    name: Validate NIP coverage matrix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0

      - name: Validate NIP coverage data
        shell: bash
        run: |
          set -euo pipefail
          matrix=tests/nips/coverage.tsv
          test -s "$matrix"
          awk -F '\t' '
            $1 ~ /^#/ { next }
            NF < 5 || $1 !~ /^NIP-[0-9A-Z]+$/ || ($3 != "integration" && $3 != "contract" && $3 != "manual" && $3 != "external") {
              print "invalid NIP coverage row " NR ": " $0 > "/dev/stderr"
              exit 1
            }
            END {
              if (NR < 1) {
                print "coverage.tsv contains no NIP entries" > "/dev/stderr"
                exit 1
              }
            }
          ' "$matrix"

          test -x tests/nips/run_all.sh
          test -x tests/nips/run_coverage.sh
